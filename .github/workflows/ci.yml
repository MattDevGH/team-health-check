# Full CI pipeline: Install → Prisma Generate → Lint → Type Check → Test → Build,
# then Playwright against a production build. All steps fail fast on error.
#
# Triggers on pushes to any branch, not just master: a feature branch previously
# ran nothing until a pull request existed, so work could accumulate unvalidated
# for days. A branch with an open PR runs both events; the concurrency group
# below cancels superseded runs so that costs at most one extra job, which is a
# fair price for catching breakage before review.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest

    # Vitest never opens a real database: unit and route tests use in-memory
    # fakes, and the integration tests create their own temporary files. A
    # DATABASE_URL here would only invite tests to depend on ambient state.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Deliberately a job of its own, running alongside `ci` rather than inside it.
  #
  # It used to be the first step of `ci`, which meant a newly disclosed advisory
  # in an unchanged dependency skipped Lint, Type check, Run tests and Build, and
  # took `e2e` with it — so CI reported nothing whatsoever about the code under
  # review. That happened on PR #20, for a MySQL driver this app never loads.
  #
  # A supply-chain advisory and a broken change are different failures, arriving
  # on different days for different reasons. Neither should silence the other.
  audit:
    name: Audit Production Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scoped to production dependencies and high severity. Dev-only advisories
      # are reported by Dependabot but do not block a pull request, since they
      # cannot be reached by a deployed application.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: ci

    # The suite provisions its own database in e2e/global-setup.ts: it deletes
    # prisma/e2e.db, applies the committed migrations, and seeds the canonical
    # questions, then playwright.config passes that DATABASE_URL to the web
    # server. Setting DATABASE_URL here would be ignored for the app under test
    # and only confuse the next reader, so it is deliberately absent — as is a
    # `prisma db push` step, which created a database nothing then used.
    #
    # TEST_MODE is set by playwright.config too; keeping it here as well would
    # imply the value matters at the job level, which it does not.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fails on any skipped test via e2e/no-skips-reporter.ts, so a required
      # scenario cannot quietly opt out and still report green
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Traces, screenshots and the seeded database from a failed run
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-failure-diagnostics
          path: |
            test-results/
            prisma/e2e.db
          retention-days: 30
          if-no-files-found: ignore

  # Skipped for Dependabot, which never writes a requirement reference and has no
  # honest one to write: a dependency bump serves the dependency tree, not a
  # requirement. Auto-filling a number on its behalf was considered and rejected —
  # the gate would then report coverage nobody claimed.
  #
  # This check greps the description for a *shape*, not a *truth*. Commit 25fcce6
  # is tagged NFR 2.1 — Accessibility — for a change pinning a MySQL driver, and
  # the gate accepted it. It is a prompt to think, never proof that anyone did,
  # and filling it in automatically would remove the only value it has.
  requirement-coverage:
    name: Requirement Coverage Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Read live, not from the event payload. The payload's body is frozen at
      # the moment the event fired, so a description edited to satisfy this gate
      # changed nothing until the next push — and re-running the job replayed
      # the same stale body. Fetching it means a re-run actually re-checks.
      - name: Check requirement references in PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          chmod +x scripts/check-requirement-coverage.sh
          PR_DESCRIPTION="$(gh pr view "$PR_NUMBER" --json body --jq .body)" \
            ./scripts/check-requirement-coverage.sh

      # The step above checks a requirement is *mentioned*. This one checks the
      # ones cited in the code are real: a reference to "Manager Experience 5.x"
      # reached a pull request description on 2026-09-15 and the requirement had
      # never existed. A citation nobody can follow is worse than none, because
      # it reads as though somebody checked.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check requirement references resolve
        run: npx tsx scripts/check-requirement-references.ts

      # Shape, not truth. 602 duplicated lines shipped in the README on
      # 2026-09-20 — everything from "## Architecture" to "## Spec", twice —
      # through a pipeline that was entirely green, because nothing read that
      # file for structure. A 65% size increase in the project’s front door
      # passed every gate.
      #
      # It cannot tell whether a paragraph is still accurate. It can tell that a
      # section is not there twice, which is the shape that accident takes.
      - name: Check no section appears twice
        run: npx tsx scripts/check-doc-structure.ts

      # AI_CONTEXT.md carried a production team id, two session ids, the scores
      # and trend indicators recorded in both, and a member handle — from
      # 2026-08-23 until 2026-09-25, in a public repository, in the file every
      # session is told to read. The rule that keeps those out of logs had
      # never been said about documents, so nothing stopped it.
      #
      # Deliberately narrow: specs and tests discuss scores and the three trend
      # values constantly, and a check that fired on those would be switched
      # off within a week.
      - name: Check no confidential data in tracked documents
        run: npx tsx scripts/check-sensitive-doc-content.ts

      # AI_CONTEXT.md is read at the start of every session, and its header
      # asserted a branch merged a month earlier, a CI job that "has never
      # executed" but runs on every pull request, and one remaining task across
      # eleven specs written after it. Prose cannot be kept true by rule, so the
      # facts that rot are generated and this fails when they drift.
      - name: Check the generated status block is current
        run: npx tsx scripts/generate-status.ts --check
